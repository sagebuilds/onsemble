<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Onsemble Sync</title>
    <style>
      body {
        margin: 0;
        width: 280px;
        font-family: system-ui, sans-serif;
        background: #14131c;
        color: #f4f2ff;
        padding: 16px;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 4px;
      }
      p {
        font-size: 12px;
        color: #a9a5c4;
        margin: 0 0 12px;
      }
      input,
      button {
        width: 100%;
        box-sizing: border-box;
        border-radius: 10px;
        font-size: 13px;
        padding: 9px 10px;
        border: 1px solid #302d45;
      }
      input {
        background: #1d1b2b;
        color: inherit;
        margin-bottom: 8px;
      }
      button {
        background: #4f7cff;
        color: white;
        border: none;
        cursor: pointer;
        font-weight: 600;
      }
      #status {
        margin-top: 12px;
        font-size: 12px;
        color: #7ee7c0;
      }
    </style>
  </head>
  <body>
    <h1>Onsemble Sync</h1>
    <p>Enter your room code to sync playback with your friend.</p>
    <input id="code" placeholder="ROOM CODE" />
    <button id="join">Join room</button>
    <div id="status">Not connected</div>
    <script src="popup.js"></script>
  </body>
</html>
